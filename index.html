<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brisas de Gloria - BDG World</title>
    <style>
        /* Importamos las fuentes directamente de Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;800&family=Montserrat:wght@400;600&display=swap');

        /* Reinicio básico para que todo cuadre */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* FONDO OSCURO ATAVISMO (NATIVO, SIN IMÁGENES) */
        body {
            font-family: 'Montserrat', sans-serif;
            /* Degradado radial para dar profundidad */
            background: radial-gradient(circle at center, #1e293b 0%, #0b0f19 100%);
            color: #e2e8f0;
            min-height: 100vh; /* Ocupa todo el alto de la pantalla */
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Distribuye elementos: arriba, centro, abajo */
            align-items: center;
            padding: 60px 20px 30px; /* Padding para que no pegue a los bordes */
            overflow: hidden; /* Evita scrolls raros en el inicio */
        }

        /* --- BIENVENIDO A (TAMAÑO MEDIO PROPORCIONADO) --- */
        .welcome-title {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: #a38242; /* Dorado viejo sutil */
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            margin-top: 20px;
        }

        /* --- BRISAS DE GLORIA (GIGANTE, BARROCO, ORO COCHANO NATIVO) --- */
        .main-title {
            font-family: 'Cinzel Decorative', cursive, serif; /* Fuente barroca ornamentada */
            font-size: 85px; /* TAMAÑO GIGANTE */
            font-weight: 900;
            text-align: center;
            line-height: 1.1;
            text-transform: uppercase;
            letter-spacing: 3px;
            max-width: 1100px;
            margin: 15px 0;
            
            /* EFECTO ORO COCHANO / ORO VIEJO ENVEJECIDO (NATIVO CSS) */
            background: linear-gradient(
                180deg, 
                #f3e5ab 0%,   /* Oro claro arriba */
                #c5a059 25%,  /* Latón medio */
                #8c6d3b 65%,  /* Bronce envejecido */
                #4a3718 100%  /* Sombra profunda abajo */
            );
            -webkit-background-clip: text; /* Corta el fondo con la forma del texto */
            background-clip: text;
            -webkit-text-fill-color: transparent; /* Hace el texto transparente para ver el fondo */
            
            /* Relieve y profundidad para efecto metálico */
            filter: drop-shadow(2px 5px 12px rgba(0, 0, 0, 0.95));
        }

        /* TEXTO DESCRIPTIVO SIMPLIFICADO */
        .subtitle {
            font-size: 16px;
            color: #94a3b8;
            text-align: center;
            max-width: 650px;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        /* --- MENÚ INFERIOR LIGADO (NATIVO CSS) --- */
        nav {
            display: flex;
            gap: 30px;
            background: rgba(15, 23, 42, 0.9); /* Fondo semi-transparente */
            padding: 15px 40px;
            border-radius: 8px;
            border: 1px solid #785a28; /* Borde oro viejo */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        nav a {
            font-family: 'Cinzel', serif;
            color: #c5a059; /* Color oro cochano para los enlaces */
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.3s ease, transform 0.2s ease;
        }

        /* EFECTO HOVER PARA LOS ENLACES */
        nav a:hover {
            color: #f3e5ab; /* Brillo de oro claro al pasar el ratón */
            transform: translateY(-2px); /* Pequeño movimiento hacia arriba */
        }

        /* AJUSTES PARA PANTALLAS MÓVILES */
        @media (max-width: 768px) {
            .welcome-title { font-size: 20px; letter-spacing: 3px; }
            .main-title { font-size: 48px; }
            .subtitle { font-size: 14px; }
            nav { flex-direction: column; gap: 15px; text-align: center; padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- Sección Superior: Título de Bienvenida -->
    <div class="welcome-title">Bienvenido a</div>
    
    <!-- Sección Central: Título Principal Barroco y Dorado -->
    <h1 class="main-title">Brisas de Gloria</h1>
    
    <!-- Sección Central: Subtítulo Descriptivo -->
    <p class="subtitle">La experiencia 3D de carreras de caballos en desarrollo. Innovación, pasión y tecnología unidas en un legado atávico.</p>

    <!-- Sección Inferior: Menú de Navegación -->
    <nav>
        <a href="#inicio">Inicio</a>
        <a href="#sobre-el-juego">Sobre el Juego</a>
        <a href="#avances">Avances</a>
        <a href="#contacto">Contacto</a>
    </nav>

</body>
</html>
