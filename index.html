<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brisas de Gloria</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Montserrat:wght@500;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .art-container {
            width: 100%;
            max-width: 700px;
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .art-container img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        .project-desc {
            font-size: 18px;
            font-weight: 500;
            color: #c5a059;
            text-align: center;
            max-width: 700px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        nav {
            display: flex;
            gap: 20px;
            background: #111827;
            padding: 15px 30px;
            border-radius: 6px;
            border: 1px solid #785a28;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
        }

        nav a {
            font-family: 'Cinzel', serif;
            color: #f3e5ab;
            text-decoration: none;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        nav a:hover {
            color: #d4af37;
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                text-align: center;
                gap: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="art-container">
        <img src="WhatsApp Image 2026-08-19 at 09.36.16.jpeg" alt="Brisas de Gloria">
    </div>

    <p class="project-desc">Proyecto de desarrollo 3D de carreras de caballos. Pasión, innovación y tecnología en un solo lugar.</p>

    <nav>
        <a href="#inicio">Inicio</a>
        <a href="#sobre-el-juego">Sobre el Juego</a>
        <a href="#avances">Avances</a>
        <a href="#contacto">Contacto</a>
    </nav>

</body>
</html>
